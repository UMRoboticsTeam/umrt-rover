version: '3.9'

# === Networks === #
networks:
  # For 2.4 GHz (Rover Controls)
  eth0:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1

  # For 5 GHz (Cameras)
  eth1:
    driver: macvlan
    driver_opts:
      parent: eth1
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.20.1


# === CONTAINER === #
services:
  # === Rover === #
  rover:
    image: ghcr.io/umroboticsteam/umrt-rover:main
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=8
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${ROS_WORKSPACE}/umrt-rover/fastdds_profiles/fastdds_HiBW.xml:/fastdds_HiBW.xml:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # === Cameras === #
  rover-cam:
    image: ghcr.io/umroboticsteam/umrt-rover:main
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=8
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - CAM1=${CAM1}
      - CAM2=${CAM2}
    devices:
      - ${CAM1}:${CAM1}
      - ${CAM2}:${CAM2}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${ROS_WORKSPACE}/umrt-rover/fastdds_profiles/fastdds_HiBW.xml:/fastdds_HiBW.xml:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
