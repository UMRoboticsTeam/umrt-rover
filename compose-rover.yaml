services:
  bridge_rover:
    image: "${BRIDGE_ROVER_IMAGE:-ghcr.io/umroboticsteam/umrt-rover:umrt-zenoh}"
    container_name: bridge_rover
    stdin_open: true
    tty: true
    init: true
    privileged: true
    cap_add:
      - NET_ADMIN
#    runtime: nvidia
#    gpus: all
    environment:
      DISPLAY: "${DISPLAY}"

      # Set Value to False to Disable Functionality      
      BOOT_CAM: false
      BOOT_DRIVETRAIN: true
      
      # Set Value to False to Disable Network on Boot
      BOOT_LO_NET: false
      BOOT_LO_F_HI_NET: false
      BOOT_HI_NET: false
      BOOT_HI_F_LO_NET: false
      BOOT_LOC_NET: false
      BOOT_ALL_NET: false
      
      # Select the can interface
      CAN_INTERFACE: "can1"
      
#    devices:
#      - "/dev/video0:/dev/video0" # expose USB cam testing
    volumes:
      - "${RES_CONFIG_DIR:-./config}:/${BRIDGE_WORKSPACE:-/workspace/umrt-zenoh-bridge}/config"
      - "./tmp/mobile_publisher.launch.py:/opt/ros/humble/share/umrt-ros-poe-cam/launch/mobile_publisher.launch.py"
      - "./tmp/launch:/opt/ros/humble/share/umrt-arm-ros-firmware/launch"
      - "./tmp/ros2_control:/opt/ros/humble/share/umrt-arm-ros-firmware/ros2_control"
      - "./tmp/ros2_control_demo_description:/opt/ros/humble/share/umrt-arm-ros-firmware/ros2_control_demo_description"
      - "./tmp/urdf:/opt/ros/humble/share/umrt-arm-ros-firmware/urdf"
      - "./tmp/config:/opt/ros/humble/share/umrt-arm-ros-firmware/config"
      - "./tmp/umrt-arm-ros-firmware.xml:/opt/ros/humble/share/umrt-arm-ros-firmware/umrt-arm-ros-firmware.xml"
    networks:
      bridge_lo:
        ipv4_address: 10.0.10.59
      bridge_hi:
        ipv4_address: 10.0.20.59

networks:
  bridge_lo:
    external: true
  bridge_hi:
    external: true
